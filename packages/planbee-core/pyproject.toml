[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "planbee"
version = "1.0.0"
description = "Modern Open-Source Primavera P6 & Project Controls Toolkit (XER Parser, DCMA 14-Point, S-Curves, CPM)"
readme = "README.md"
authors = [{ name = "PlanBee Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "openpyxl>=3.1.0",
    "pydantic>=2.0.0"
]

[project.scripts]
planbee = "planbee.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["planbee*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
